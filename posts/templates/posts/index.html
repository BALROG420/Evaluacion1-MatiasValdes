{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Registro de Bandas</h1>
    <a href="{% url 'posts:form_banda' %}" class="btn btn-primary">+ Publicar banda</a>
</div>

<div class="row">
    {% for banda in bandas %}
    <div class="col-md-3 mb-4">
        <div class="band-card" onclick="window.location='{% url 'posts:banda_detalle' banda.id %}'">
            <img src="{{ banda.logo.url }}" class="img-fluid band-card-img" alt="{{ banda.banda }}">
            <div class="band-card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">{{ banda.banda }}</h5>
                    <div onclick="event.stopPropagation();">
                        <a href="{% url 'posts:editar_banda' banda.id %}" class="edit-icon">
                            <i class="fas fa-pen"></i>
                        </a>
                        <form method="post" action="{% url 'posts:borrar_banda' banda.id %}" class="d-inline" onsubmit="return confirm('¿Borrar {{ banda.banda }}?');">
                            {% csrf_token %}
                            <button type="submit" class="edit-icon border-0 bg-transparent">
                                <i class="fas fa-trash"style="color: #888;"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <p>{{ banda.pais }}</p>
                <p class="band-card-genres">
                    {% for g in banda.generos.all %}{{ g.genero }}{% if not forloop.last %}, {% endif %}{% endfor %}
                </p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
